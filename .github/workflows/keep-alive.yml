name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes 24/7 via GitHub Actions
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Sending keep-alive ping to Render backend..."
          curl -s -f -m 30 "https://dsdl-recruitment-backend-3.onrender.com/api/health" || echo "Ping failed or backend waking up"
